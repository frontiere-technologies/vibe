name: vibe-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the setup
        run: bash vibe/scripts/check-setup.sh

      - name: Test the setup check
        run: bash vibe/scripts/tests/check-setup.test.sh

      # gitleaks runs from its official container image, not from the
      # gitleaks-action (the Action needs a paid licence for organisations).
      # safe.directory is passed through the environment because the mounted
      # repository is owned by another user than the one inside the container.
      - name: Scan the full history for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact -v
